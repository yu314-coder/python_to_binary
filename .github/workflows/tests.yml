name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Diagnose generated macOS ARM64 executable
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          printf "print('ci-arm64-diagnostic')\n" > "$RUNNER_TEMP/diagnostic.py"
          PYTHONPATH=src python -m py2bin compile "$RUNNER_TEMP/diagnostic.py" \
            -o "$RUNNER_TEMP/diagnostic" --os macos --arch arm64
          codesign --verify --verbose=4 "$RUNNER_TEMP/diagnostic"
          otool -l "$RUNNER_TEMP/diagnostic"
          lldb --batch -o run -o "register read" -o bt -- "$RUNNER_TEMP/diagnostic"
      - name: Build wheel
        shell: bash
        run: python -m pip wheel . --no-deps -w dist
